<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>PABLO — Doomsday Farm Control</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#070b14;
  --panel:#101827;
  --panel2:#151f31;
  --line:#243247;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --green:#34d399;
  --yellow:#fbbf24;
  --red:#fb7185;
  --blue:#60a5fa;
  --purple:#a78bfa;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#14213a 0,#070b14 48%);
  color:var(--text);
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1250px;margin:auto;padding:18px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:18px
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:48px;height:48px;border-radius:15px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  font-size:24px;font-weight:900;
  box-shadow:0 10px 35px #0007
}
h1{margin:0;font-size:22px}
.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);padding:10px 13px;border-radius:11px
}
.btn:hover{border-color:#526783}
.btn.primary{background:#2563eb;border-color:#2563eb}
.btn.danger{background:#3b1620;border-color:#7f1d1d;color:#fecdd3}
.btn.ai{background:#25153d;border-color:#6d28d9}
.grid{
  display:grid;grid-template-columns:repeat(12,1fr);gap:14px
}
.card{
  grid-column:span 4;background:linear-gradient(145deg,var(--panel),#0d1524);
  border:1px solid var(--line);border-radius:17px;padding:17px;
  box-shadow:0 12px 35px #0003
}
.card.wide{grid-column:span 8}
.card.full{grid-column:1/-1}
.card h2{font-size:16px;margin:0 0 14px}
.status{
  display:flex;align-items:center;gap:8px;color:var(--green);
  font-size:13px
}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{
  background:#0b1220;border:1px solid var(--line);
  border-radius:12px;padding:12px
}
.stat b{display:block;font-size:22px;margin-top:3px}
.muted{color:var(--muted);font-size:12px}
.farms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.farm{
  border:1px solid var(--line);background:#0b1220;
  border-radius:14px;padding:13px
}
.farmhead{display:flex;justify-content:space-between;gap:8px}
.farmname{font-weight:800}
.badge{
  padding:4px 8px;border-radius:99px;font-size:11px;
  background:#064e3b;color:#a7f3d0
}
.badge.off{background:#3f1722;color:#fecdd3}
.rows{display:grid;gap:8px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1c293c;padding-bottom:7px}
.row:last-child{border-bottom:0}
.mini-actions{display:flex;gap:6px;margin-top:12px}
.mini-actions button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:#121c2d;color:var(--text)}
.marches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.march{
  background:#0b1220;border:1px solid var(--line);
  border-radius:12px;padding:10px;text-align:center
}
.march b{display:block;margin:5px 0}
.bar{height:6px;background:#1e293b;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);width:72%}
.log{
  max-height:180px;overflow:auto;display:grid;gap:7px
}
.log div{
  padding:9px 10px;border-radius:9px;background:#0b1220;
  color:#cbd5e1;font-size:12px
}
.assistant{
  background:linear-gradient(135deg,#17112a,#111827);
  border-color:#5b21b6
}
.chat{
  min-height:110px;background:#0b1220;border-radius:12px;
  padding:12px;color:#dbeafe
}
.footer{
  text-align:center;color:#64748b;font-size:11px;padding:22px 0 8px
}
.signature{color:#a78bfa;font-weight:800;letter-spacing:1px}
.modal{
  position:fixed;inset:0;background:#0009;display:none;
  align-items:center;justify-content:center;padding:18px;z-index:10
}
.modal.show{display:flex}
.modalbox{
  width:min(500px,100%);background:#101827;border:1px solid var(--line);
  border-radius:18px;padding:18px
}
input,select{
  width:100%;background:#0b1220;color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:11px;
  margin:7px 0 12px
}
@media(max-width:900px){
  .card,.card.wide{grid-column:1/-1}
  .farms{grid-template-columns:1fr}
  .marches{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">P</div>
    <div>
      <h1>Doomsday Farm Control</h1>
      <div class="subtitle">PABLO Master Control • الإصدار الرئيسي</div>
    </div>
  </div>

  <div class="actions">
    <select id="language" style="width:auto;margin:0">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
    <button class="btn ai" onclick="openAI()">🤖 PABLO</button>

      <div class="stat"><span class="muted">نشطة</span><b>2</b></div>
      <div class="stat"><span class="muted">متوقفة</span><b>1</b></div>
    </div>
  </div>

  <div class="card full">
    <h2>🌾 المزارع</h2>
    <div class="farms" id="farms">

      <div class="farm
